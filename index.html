<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Barr Phonics — KS3 &amp; 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f3ef;
    --surface: #ffffff;
    --sidebar-bg: #1a1a2e;
    --sidebar-text: #e8e4f0;
    --sidebar-muted: #9b8fb5;
    --sidebar-hover: rgba(255,255,255,0.07);
    --sidebar-active: rgba(255,255,255,0.13);
    --accent: #6c63ff;
    --accent-light: #ede9ff;
    --accent-dark: #4b44cc;
    --vowel: #16a085;
    --consonant: #555;
    --text: #1a1a2e;
    --text-muted: #7a748a;
    --text-faint: #bbb;
    --border: rgba(0,0,0,0.09);
    --border-strong: rgba(0,0,0,0.18);
    --radius: 10px;
    --radius-lg: 16px;
    --font-display: 'Nunito', sans-serif;
    --font-body: 'Nunito Sans', sans-serif;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Layout ── */
  .app-shell {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: 56px 1fr;
    height: 100vh;
    overflow: hidden;
  }


  /* ── Top bar ── */
  .topbar {
    grid-column: 1 / -1;
    background: var(--sidebar-bg);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .topbar-logo {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 18px;
    color: #fff;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .topbar-logo span {
    background: var(--accent);
    color: #fff;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .topbar-list-name {
    flex: 1;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid rgba(255,255,255,0.2);
    padding: 2px 6px;
    max-width: 280px;
    outline: none;
    transition: border-color 0.2s;
  }
  .topbar-list-name:focus { border-bottom-color: var(--accent); }
  .topbar-list-name::placeholder { color: rgba(255,255,255,0.3); }

  .topbar-actions { display: flex; gap: 8px; margin-left: auto; }
  .btn {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 0 14px;
    height: 32px;
    border-radius: 8px;
    border: 1.5px solid transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-ghost { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.15); }
  .btn-ghost:hover { background: rgba(255,255,255,0.18); }
  .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent-dark); }
  .btn-accent:hover { background: var(--accent-dark); }
  .btn-danger { background: transparent; color: #e87878; border-color: rgba(232,120,120,0.3); }
  .btn-danger:hover { background: rgba(232,120,120,0.1); }
  .btn-sm { font-size: 12px; height: 28px; padding: 0 10px; }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid rgba(255,255,255,0.05);
  }
  .sidebar-section {
    padding: 14px 14px 8px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--sidebar-muted);
  }
  .add-row {
    display: flex;
    gap: 6px;
    padding: 0 12px 12px;
  }
  .add-row input {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: #fff;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 0 10px;
    height: 34px;
    outline: none;
    transition: border-color 0.2s;
  }
  .add-row input::placeholder { color: rgba(255,255,255,0.3); }
  .add-row input:focus { border-color: var(--accent); }
  .add-row .add-btn {
    width: 34px; height: 34px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .add-row .add-btn:hover { background: var(--accent-dark); }

  .word-list-scroll { flex: 1; overflow-y: auto; padding: 0 8px; }
  .word-list-scroll::-webkit-scrollbar { width: 4px; }
  .word-list-scroll::-webkit-scrollbar-track { background: transparent; }
  .word-list-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

  .word-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: var(--sidebar-text);
    font-family: var(--font-display);
    transition: background 0.12s;
    margin-bottom: 2px;
  }
  .word-item:hover { background: var(--sidebar-hover); }
  .word-item.active { background: var(--sidebar-active); color: #fff; }
  .word-item-del {
    opacity: 0;
    color: #e87878;
    font-size: 18px;
    line-height: 1;
    padding: 0 2px;
    cursor: pointer;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .word-item:hover .word-item-del { opacity: 1; }

  .sidebar-presets {
    padding: 12px;
    border-top: 1px solid rgba(255,255,255,0.07);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .preset-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--sidebar-text);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    padding: 7px 12px;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
  }
  .preset-btn:hover { background: rgba(255,255,255,0.12); }

  .sidebar-bottom {
    padding: 10px 12px;
    border-top: 1px solid rgba(255,255,255,0.07);
    display: flex;
    gap: 6px;
  }

  /* ── Main area ── */
  .main {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .controls-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .control-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  input[type=range] {
    width: 100px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .toggle-group {
    display: flex;
    border: 1.5px solid var(--border-strong);
    border-radius: 8px;
    overflow: hidden;
  }
  .toggle-btn {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .toggle-btn.active { background: var(--accent); color: #fff; }
  .toggle-btn:not(:last-child) { border-right: 1.5px solid var(--border-strong); }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
  }
  .checkbox-label input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }

  /* ── Display area ── */
  .display-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px;
  }
  .display-wrap::-webkit-scrollbar { width: 6px; }
  .display-wrap::-webkit-scrollbar-track { background: transparent; }
  .display-wrap::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }

  .word-display-list { display: flex; flex-direction: column; gap: 36px; }

  .display-word-block { display: flex; flex-direction: column; gap: 8px; }
  .display-word-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 2px; }

  .ph-unit { display: flex; flex-direction: column; align-items: center; }
  .ph-letters { display: flex; }
  .ph-char {
    font-family: var(--font-display);
    font-weight: 900;
    color: var(--text);
    line-height: 1.05;
    text-align: center;
  }
  .ph-marker-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 4px;
    gap: 3px;
  }
  .ph-dot { border-radius: 50%; flex-shrink: 0; }
  .ph-bar { border-radius: 2px; flex-shrink: 0; }
  .ph-space { display: inline-block; }

  .phoneme-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .phoneme-chip {
    font-size: 12px;
    font-family: var(--font-body);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    padding: 2px 9px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .phoneme-sep { font-size: 13px; color: var(--text-faint); align-self: center; }

  /* ── One-at-a-time view ── */
  .one-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    gap: 32px;
  }
  .one-nav {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .nav-btn {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    padding: 10px 24px;
    border-radius: 10px;
    border: 2px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 8px;
  }
  .nav-btn:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .word-counter {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 600;
    min-width: 60px;
    text-align: center;
  }

  /* ── Legend ── */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    padding: 10px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
  .legend-bar { height: 5px; border-radius: 2px; }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-faint);
    font-size: 15px;
    font-family: var(--font-display);
    font-weight: 600;
  }
  .empty-state p { margin-top: 8px; font-size: 13px; font-weight: 400; font-family: var(--font-body); }

  /* ── Definitions ── */
  .def-block {
    margin-top: 10px;
    padding: 10px 14px;
    background: var(--accent-light);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    font-size: 15px;
    font-family: var(--font-body);
    color: var(--text);
    line-height: 1.55;
    max-width: 680px;
  }
  .def-block.loading {
    color: var(--text-muted);
    font-style: italic;
    animation: pulse 1.2s infinite;
  }
  .def-block.error { background: #fff0f0; border-color: #e87878; color: #a33; font-style: italic; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }

  .reading-age-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--accent);
    color: #fff;
    border-radius: 4px;
    padding: 1px 6px;
    margin-right: 6px;
    vertical-align: middle;
  }

  .age-slider-wrap { display: flex; align-items: center; gap: 8px; }
  .age-label { font-size: 12px; font-weight: 700; color: var(--accent); min-width: 48px; }

  /* ── Print ── */
  @media print {
    .sidebar, .topbar, .controls-bar, .legend { display: none !important; }
    .app-shell { display: block; height: auto; }
    .main { background: white; display: block; }
    .display-wrap { padding: 20px; overflow: visible; }
    .word-display-list { gap: 40px; }
    .one-view { display: block; }
    .one-nav, .word-counter { display: none; }
    .ph-char { color: #000 !important; }
    .ph-dot, .ph-bar { }
    body { background: white; }
    .print-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 24px;
      display: block !important;
    }
  }
  .print-title { display: none; }
</style>
</head>
<body>

<div class="app-shell">


  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-logo">
      Barr Phonics <span>KS3 &amp; 4</span>
    </div>
    <input class="topbar-list-name" id="listName" type="text" value="My phonics list" placeholder="List name..." />
    <div class="topbar-actions">
      <button class="btn btn-ghost" onclick="window.print()">
        &#128438; Print worksheet
      </button>
      <button class="btn btn-ghost" onclick="exportTxt()">
        &#8681; Export .txt
      </button>
      <button class="btn btn-accent" onclick="exportHtml()">
        &#8681; Save as HTML
      </button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">Add words</div>
    <div class="add-row">
      <input type="text" id="addInput" placeholder="Type a word..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <button class="add-btn" onclick="addWord()" title="Add word">+</button>
    </div>

    <div class="sidebar-section">Your list (<span id="wordCount">0</span>)</div>
    <div class="word-list-scroll" id="wordList"></div>

    <div class="sidebar-presets">
      <div class="sidebar-section" style="padding:0 0 8px;font-size:10px;">Quick load</div>
      <button class="preset-btn" onclick="loadPreset('cvc')">&#9654; CVC words</button>
      <button class="preset-btn" onclick="loadPreset('digraphs')">&#9654; Digraph words</button>
      <button class="preset-btn" onclick="loadPreset('blends')">&#9654; Consonant blends</button>
      <button class="preset-btn" onclick="loadPreset('vowelDigraphs')">&#9654; Vowel digraphs</button>
      <button class="preset-btn" onclick="loadPreset('trigraphs')">&#9654; Trigraphs</button>
    </div>

    <div class="sidebar-bottom">
      <button class="btn btn-danger btn-sm" style="flex:1;" onclick="clearList()">Clear list</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="mainArea">

    <div class="controls-bar">
      <div class="control-group">
        <span class="control-label">View</span>
        <div class="toggle-group">
          <button class="toggle-btn active" id="btnList" onclick="setView('list')">List</button>
          <button class="toggle-btn" id="btnOne" onclick="setView('one')">Whiteboard</button>
        </div>
      </div>
      <div class="control-group">
        <span class="control-label">Size</span>
        <input type="range" min="28" max="96" value="48" step="4" id="fontSizeSlider" oninput="onSizeChange(this.value)" />
        <span style="font-size:12px;color:var(--text-muted);min-width:32px;" id="fontSizeVal">48px</span>
      </div>
      <label class="checkbox-label">
        <input type="checkbox" id="showPhonemes" onchange="renderDisplay()" /> Show phonemes
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="showType" onchange="renderDisplay()" /> Show type label
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="showDef" onchange="onDefToggle()" /> Definitions
      </label>
      <div class="control-group age-slider-wrap" id="ageSliderGroup" style="display:none;">
        <span class="control-label">Reading age</span>
        <input type="range" min="5" max="15" value="9" step="1" id="readingAge" oninput="onAgeChange(this.value)" style="width:80px;" />
        <span class="age-label" id="readingAgeVal">age 9</span>
      </div>
    </div>

    <div id="listViewWrap" style="flex:1;overflow-y:auto;">
      <div class="display-wrap">
        <div class="print-title" id="printTitle"></div>
        <div class="word-display-list" id="wordDisplayList">
          <div class="empty-state">&#127381; Add words to get started
            <p>Type in the sidebar, or use a quick-load preset.</p>
          </div>
        </div>
      </div>
    </div>

    <div id="oneViewWrap" style="display:none;flex:1;display:none;flex-direction:column;">
      <div class="one-view" id="oneWordArea"></div>
      <div class="one-nav">
        <button class="nav-btn" id="prevBtn" onclick="prevWord()">&#8592; Prev</button>
        <span class="word-counter" id="wordCounter"></span>
        <button class="nav-btn" id="nextBtn" onclick="nextWord()">Next &#8594;</button>
      </div>
      <div style="padding:16px;"></div>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--vowel);"></div>Vowel</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--consonant);"></div>Consonant</div>
      <div class="legend-item"><div class="legend-bar" style="width:22px;background:var(--consonant);"></div>Digraph</div>
      <div class="legend-item"><div class="legend-bar" style="width:32px;background:var(--consonant);"></div>Trigraph</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--consonant);"></div><div class="legend-dot" style="background:var(--consonant);margin-left:2px;"></div>Blend (one dot per letter)</div>
    </div>

  </main>
</div>

<script>
const PHONEME_MAP = {
  "tch":{phoneme:"/tʃ/",type:"trigraph"},"dge":{phoneme:"/dʒ/",type:"trigraph"},"igh":{phoneme:"/aɪ/",type:"trigraph"},
  "thr":{phoneme:"/θr/",type:"trigraph"},"shr":{phoneme:"/ʃr/",type:"trigraph"},
  "str":{phoneme:"/str/",type:"blend"},"spl":{phoneme:"/spl/",type:"blend"},"spr":{phoneme:"/spr/",type:"blend"},"scr":{phoneme:"/skr/",type:"blend"},
  "ch":{phoneme:"/tʃ/",type:"digraph"},"sh":{phoneme:"/ʃ/",type:"digraph"},"th":{phoneme:"/θ/",type:"digraph"},
  "ph":{phoneme:"/f/",type:"digraph"},"wh":{phoneme:"/w/",type:"digraph"},"ng":{phoneme:"/ŋ/",type:"digraph"},
  "nk":{phoneme:"/ŋk/",type:"digraph"},"ck":{phoneme:"/k/",type:"digraph"},"qu":{phoneme:"/kw/",type:"digraph"},
  "gh":{phoneme:"/f/",type:"digraph"},
  "ea":{phoneme:"/iː/",type:"digraph"},"ee":{phoneme:"/iː/",type:"digraph"},"oa":{phoneme:"/əʊ/",type:"digraph"},
  "oo":{phoneme:"/uː/",type:"digraph"},"ou":{phoneme:"/aʊ/",type:"digraph"},"ow":{phoneme:"/aʊ/",type:"digraph"},
  "oi":{phoneme:"/ɔɪ/",type:"digraph"},"oy":{phoneme:"/ɔɪ/",type:"digraph"},"ai":{phoneme:"/eɪ/",type:"digraph"},
  "ay":{phoneme:"/eɪ/",type:"digraph"},"ey":{phoneme:"/eɪ/",type:"digraph"},"ie":{phoneme:"/iː/",type:"digraph"},
  "ue":{phoneme:"/uː/",type:"digraph"},"ui":{phoneme:"/uː/",type:"digraph"},"au":{phoneme:"/ɔː/",type:"digraph"},
  "aw":{phoneme:"/ɔː/",type:"digraph"},"ew":{phoneme:"/uː/",type:"digraph"},
  "bl":{phoneme:"/bl/",type:"blend"},"br":{phoneme:"/br/",type:"blend"},"cl":{phoneme:"/kl/",type:"blend"},
  "cr":{phoneme:"/kr/",type:"blend"},"dr":{phoneme:"/dr/",type:"blend"},"fl":{phoneme:"/fl/",type:"blend"},
  "fr":{phoneme:"/fr/",type:"blend"},"gl":{phoneme:"/gl/",type:"blend"},"gr":{phoneme:"/gr/",type:"blend"},
  "pl":{phoneme:"/pl/",type:"blend"},"pr":{phoneme:"/pr/",type:"blend"},"sk":{phoneme:"/sk/",type:"blend"},
  "sl":{phoneme:"/sl/",type:"blend"},"sm":{phoneme:"/sm/",type:"blend"},"sn":{phoneme:"/sn/",type:"blend"},
  "sp":{phoneme:"/sp/",type:"blend"},"st":{phoneme:"/st/",type:"blend"},"sw":{phoneme:"/sw/",type:"blend"},
  "tr":{phoneme:"/tr/",type:"blend"},"tw":{phoneme:"/tw/",type:"blend"},"nd":{phoneme:"/nd/",type:"blend"},
  "nt":{phoneme:"/nt/",type:"blend"},"mp":{phoneme:"/mp/",type:"blend"},"ft":{phoneme:"/ft/",type:"blend"},
  "ld":{phoneme:"/ld/",type:"blend"},"lp":{phoneme:"/lp/",type:"blend"},"lt":{phoneme:"/lt/",type:"blend"},
  "lk":{phoneme:"/lk/",type:"blend"},"nch":{phoneme:"/ntʃ/",type:"trigraph"},
};

const VOWELS = "aeiou";
const SP = {
  a:"/æ/",e:"/ɛ/",i:"/ɪ/",o:"/ɒ/",u:"/ʌ/",b:"/b/",c:"/k/",d:"/d/",f:"/f/",g:"/g/",
  h:"/h/",j:"/dʒ/",k:"/k/",l:"/l/",m:"/m/",n:"/n/",p:"/p/",r:"/r/",s:"/s/",
  t:"/t/",v:"/v/",w:"/w/",x:"/ks/",y:"/j/",z:"/z/",q:"/k/"
};

const PRESETS = {
  cvc: ["cat","dog","hat","sit","hop","run","big","let","cup","pin","fox","mud","bag","bed","lip","pot"],
  digraphs: ["ship","chat","thin","when","ring","duck","phone","coat","feet","rain","teeth","chain","wheel","shock","throb"],
  blends: ["splash","frog","clap","drip","slip","plan","crab","drop","blend","strap","glum","pram","snip","twin","skull"],
  vowelDigraphs: ["rain","feet","coat","boat","head","moon","food","coin","loud","draw","play","soil","grew","blue","haul"],
  trigraphs: ["night","light","fight","sight","right","catch","match","fetch","stitch","witch","budge","ledge","fudge","bridge","lodge"],
};

let words = [];
let currentView = "list";
let currentIdx = 0;
let fontSize = 48;

function parseWord(word) {
  const w = word.toLowerCase().replace(/[^a-z]/g,"");
  const segs = []; let i = 0;
  while (i < w.length) {
    let matched = false;
    for (const len of [3,2]) {
      const chunk = w.slice(i, i+len);
      if (PHONEME_MAP[chunk]) { segs.push({grapheme:chunk,...PHONEME_MAP[chunk]}); i+=len; matched=true; break; }
    }
    if (!matched) {
      const ch = w[i], isV = VOWELS.includes(ch);
      segs.push({grapheme:ch, phoneme:SP[ch]||`/${ch}/`, type:isV?"vowel":"consonant"});
      i++;
    }
  }
  return segs;
}

function buildWordEl(word, fs) {
  const segs = parseWord(word);
  const showPh = document.getElementById("showPhonemes").checked;
  const showType = document.getElementById("showType").checked;
  const lw = Math.round(fs * 0.65);
  const dotSz = Math.max(8, Math.round(fs * 0.17));
  const barH = Math.max(5, Math.round(fs * 0.13));

  const block = document.createElement("div");
  block.className = "display-word-block";

  const row = document.createElement("div");
  row.className = "display-word-row";

  segs.forEach(seg => {
    const unit = document.createElement("div");
    unit.className = "ph-unit";

    const letDiv = document.createElement("div");
    letDiv.className = "ph-letters";
    for (const ch of seg.grapheme) {
      const sp = document.createElement("span");
      sp.className = "ph-char";
      sp.textContent = ch;
      sp.style.cssText = `font-size:${fs}px;width:${lw}px;`;
      letDiv.appendChild(sp);
    }
    unit.appendChild(letDiv);

    if (showType) {
      const tl = document.createElement("div");
      tl.style.cssText = `font-size:${Math.max(9,Math.round(fs*0.18))}px;color:var(--text-muted);font-family:var(--font-body);font-weight:600;margin-top:2px;letter-spacing:0.03em;`;
      tl.textContent = seg.type;
      unit.appendChild(tl);
    }

    const totalW = seg.grapheme.length * lw;
    const mRow = document.createElement("div");
    mRow.className = "ph-marker-row";
    mRow.style.cssText = `width:${totalW}px;height:${dotSz+4}px;margin-top:${showType?2:4}px;`;

    if (seg.type === "digraph" || seg.type === "trigraph") {
      const bar = document.createElement("div");
      bar.className = "ph-bar";
      bar.style.cssText = `width:${totalW-4}px;height:${barH}px;background:var(--consonant);`;
      mRow.appendChild(bar);
    } else if (seg.type === "blend") {
      mRow.style.gap = `${Math.max(3,Math.round(dotSz*0.35))}px`;
      for (let i=0; i<seg.grapheme.length; i++) {
        const dot = document.createElement("div");
        dot.className = "ph-dot";
        dot.style.cssText = `width:${dotSz}px;height:${dotSz}px;background:var(--consonant);`;
        mRow.appendChild(dot);
      }
    } else {
      const col = seg.type === "vowel" ? "var(--vowel)" : "var(--consonant)";
      const dot = document.createElement("div");
      dot.className = "ph-dot";
      dot.style.cssText = `width:${dotSz}px;height:${dotSz}px;background:${col};`;
      mRow.appendChild(dot);
    }

    unit.appendChild(mRow);
    row.appendChild(unit);
  });

  block.appendChild(row);

  if (showPh) {
    const chips = document.createElement("div");
    chips.className = "phoneme-chips";
    segs.forEach((seg, i) => {
      if (i > 0) {
        const sep = document.createElement("span");
        sep.className = "phoneme-sep";
        sep.textContent = "·";
        chips.appendChild(sep);
      }
      const chip = document.createElement("span");
      chip.className = "phoneme-chip";
      chip.textContent = seg.phoneme;
      chips.appendChild(chip);
    });
    block.appendChild(chips);
  }

  if (document.getElementById("showDef").checked) {
    block.appendChild(buildDefEl(word, fs));
  }

  return block;
}

function renderDisplay() {
  document.getElementById("printTitle").textContent = document.getElementById("listName").value;
  const listWrap = document.getElementById("listViewWrap");
  const oneWrap = document.getElementById("oneViewWrap");

  if (currentView === "list") {
    listWrap.style.display = "block";
    oneWrap.style.display = "none";
    const container = document.getElementById("wordDisplayList");
    container.innerHTML = "";
    if (words.length === 0) {
      container.innerHTML = '<div class="empty-state">&#127381; Add words to get started<p>Type in the sidebar, or use a quick-load preset.</p></div>';
      return;
    }
    words.forEach(w => container.appendChild(buildWordEl(w, fontSize)));
  } else {
    listWrap.style.display = "none";
    oneWrap.style.display = "flex";
    const area = document.getElementById("oneWordArea");
    area.innerHTML = "";
    if (words.length === 0) {
      area.innerHTML = '<div class="empty-state">Add words to your list</div>';
      document.getElementById("wordCounter").textContent = "";
      document.getElementById("prevBtn").disabled = true;
      document.getElementById("nextBtn").disabled = true;
      return;
    }
    if (currentIdx >= words.length) currentIdx = words.length - 1;
    area.appendChild(buildWordEl(words[currentIdx], Math.min(fontSize * 1.8, 128)));
    document.getElementById("wordCounter").textContent = `${currentIdx+1} / ${words.length}`;
    document.getElementById("prevBtn").disabled = currentIdx === 0;
    document.getElementById("nextBtn").disabled = currentIdx === words.length - 1;
  }
}

function renderSidebar() {
  const list = document.getElementById("wordList");
  list.innerHTML = "";
  document.getElementById("wordCount").textContent = words.length;
  words.forEach((w, i) => {
    const item = document.createElement("div");
    item.className = "word-item" + (currentView==="one" && i===currentIdx ? " active" : "");

    const label = document.createElement("span");
    label.textContent = w;

    const del = document.createElement("span");
    del.className = "word-item-del";
    del.textContent = "×";
    del.title = "Remove";
    del.onclick = e => {
      e.stopPropagation();
      words.splice(i, 1);
      if (currentIdx >= words.length) currentIdx = Math.max(0, words.length-1);
      renderSidebar(); renderDisplay();
    };

    item.onclick = () => { currentIdx = i; renderSidebar(); renderDisplay(); };
    item.appendChild(label);
    item.appendChild(del);
    list.appendChild(item);
  });
}

function addWord() {
  const inp = document.getElementById("addInput");
  const val = inp.value.trim().toLowerCase().replace(/[^a-z ]/g,"");
  if (!val) return;
  val.split(/\s+/).forEach(w => { if (w && !words.includes(w)) { words.push(w); if(document.getElementById("showDef").checked) fetchDefinition(w); } });
  inp.value = "";
  renderSidebar(); renderDisplay();
}

function clearList() {
  if (words.length && !confirm("Clear the whole list?")) return;
  words = []; currentIdx = 0;
  renderSidebar(); renderDisplay();
}

function loadPreset(key) {
  words = [...PRESETS[key]]; currentIdx = 0;
  if(document.getElementById("showDef").checked) words.forEach(w => fetchDefinition(w));
  renderSidebar(); renderDisplay();
}

function setView(v) {
  currentView = v;
  document.getElementById("btnList").classList.toggle("active", v==="list");
  document.getElementById("btnOne").classList.toggle("active", v==="one");
  renderDisplay(); renderSidebar();
}

function prevWord() { if (currentIdx > 0) { currentIdx--; renderDisplay(); renderSidebar(); } }
function nextWord() { if (currentIdx < words.length-1) { currentIdx++; renderDisplay(); renderSidebar(); } }

function onSizeChange(v) {
  fontSize = parseInt(v);
  document.getElementById("fontSizeVal").textContent = v + "px";
  renderDisplay();
}

function exportTxt() {
  const name = document.getElementById("listName").value || "phonics-list";
  const lines = [name, "=".repeat(name.length), ""];
  words.forEach(w => {
    const segs = parseWord(w);
    lines.push(`${w}  →  ${segs.map(s => s.grapheme + " (" + s.type + ")").join(" | ")}`);
    lines.push(`       ${segs.map(s => s.phoneme).join(" · ")}`);
    const key = w + "_" + readingAge;
    if (defCache[key] && defCache[key] !== "__loading__" && defCache[key] !== "__error__") {
      lines.push(`       Definition (age ${readingAge}): ${defCache[key]}`);
    }
    lines.push("");
  });
  download(name.replace(/\s+/g,"-")+".txt", lines.join("\n"), "text/plain");
}

function exportHtml() {
  const name = document.getElementById("listName").value || "phonics-list";
  const wordRows = words.map(w => {
    const segs = parseWord(w);
    const lw = 38, dotSz = 10, barH = 6;
    const unitHtml = segs.map(seg => {
      const lettersHtml = seg.grapheme.split("").map(ch =>
        `<span style="font-family:'Nunito',sans-serif;font-weight:900;font-size:48px;width:${lw}px;text-align:center;line-height:1.05;display:inline-block;">${ch}</span>`
      ).join("");
      const totalW = seg.grapheme.length * lw;
      let markerHtml = "";
      if (seg.type==="digraph"||seg.type==="trigraph") {
        markerHtml = `<div style="width:${totalW-4}px;height:${barH}px;border-radius:2px;background:#555;"></div>`;
      } else if (seg.type==="blend") {
        markerHtml = seg.grapheme.split("").map(()=>`<div style="width:${dotSz}px;height:${dotSz}px;border-radius:50%;background:#555;margin:0 2px;"></div>`).join("");
      } else {
        const col = seg.type==="vowel"?"#16a085":"#555";
        markerHtml = `<div style="width:${dotSz}px;height:${dotSz}px;border-radius:50%;background:${col};"></div>`;
      }
      return `<div style="display:flex;flex-direction:column;align-items:center;margin:0 1px;">
        <div style="display:flex;">${lettersHtml}</div>
        <div style="display:flex;align-items:center;justify-content:center;width:${totalW}px;height:${dotSz+4}px;margin-top:4px;gap:3px;">${markerHtml}</div>
      </div>`;
    }).join("");
    return `<div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;margin-bottom:36px;">${unitHtml}</div>`;
  }).join("");

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${name}</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>body{font-family:sans-serif;padding:40px;background:#fff;}h1{font-family:'Nunito',sans-serif;font-size:24px;margin-bottom:32px;}</style>
</head><body><h1>${name}</h1>${wordRows}</body></html>`;
  download(name.replace(/\s+/g,"-")+".html", html, "text/html");
}

function download(filename, content, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = filename;
  a.click();
}

// ── Definitions via Claude API ──
const defCache = {};
let readingAge = 9;

function onDefToggle() {
  const on = document.getElementById("showDef").checked;
  document.getElementById("ageSliderGroup").style.display = on ? "flex" : "none";
  renderDisplay();
}

function onAgeChange(v) {
  readingAge = parseInt(v);
  document.getElementById("readingAgeVal").textContent = "age " + v;
  // Bust cache so definitions regenerate at new age
  Object.keys(defCache).forEach(k => { if (k.endsWith("_" + v)) {} else delete defCache[k]; });
  renderDisplay();
}

async function fetchDefinition(word) {
  const key = word + "_" + readingAge;
  if (defCache[key]) return defCache[key];
  defCache[key] = "__loading__";

  try {
    // Free Dictionary API — no key needed
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if (!res.ok) throw new Error("not found");
    const data = await res.json();
    // Pull first definition from first meaning
    const def = data?.[0]?.meanings?.[0]?.definitions?.[0]?.definition;
    if (def) {
      defCache[key] = def;
    } else {
      defCache[key] = "__error__";
    }
  } catch(e) {
    defCache[key] = "__error__";
  }
  return defCache[key];
}

function buildDefEl(word, fs) {
  const key = word + "_" + readingAge;
  const cached = defCache[key];
  const wrap = document.createElement("div");

  if (!cached || cached === "__loading__") {
    wrap.className = "def-block loading";
    wrap.textContent = "Fetching definition…";
    if (!cached) {
      fetchDefinition(word).then(() => renderDisplay());
    }
  } else if (cached === "__error__") {
    wrap.className = "def-block error";
    wrap.innerHTML = `Could not find a definition for <em>${word}</em>. Try checking the spelling.`;
  } else {
    wrap.className = "def-block";
    wrap.textContent = cached;
  }
  return wrap;
}

document.getElementById("addInput").addEventListener("keydown", e => { if (e.key==="Enter") addWord(); });
document.addEventListener("keydown", e => {
  if (currentView==="one") {
    if (e.key==="ArrowRight"||e.key==="ArrowDown") nextWord();
    if (e.key==="ArrowLeft"||e.key==="ArrowUp") prevWord();
  }
});

loadPreset("cvc");
</script>
